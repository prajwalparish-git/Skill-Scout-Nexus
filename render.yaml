# Render Blueprint for the FastAPI backend (server.py). Deploy: dashboard.render.com ->
# New -> Blueprint -> this repo. The Next.js frontend is not deployed from this file — it goes
# to Vercel (see README.md > Deployment).
#
# This is a free-tier demo setup. The SQLite databases (accounts, sessions, plans, quizzes and
# the telemetry's local copy) use their default paths under /app/data inside the container,
# which Render wipes on every deploy, restart and idle spin-down: demo accounts do not last.
# To keep them, move to a paid instance type and uncomment the two /data paths and the
# `disk:` block at the bottom (Render refuses a disk on the free plan).
services:
  - type: web
    name: skill-scout-nexus-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MOCK_MODE
        value: "false"
      - key: LOCAL_MODE
        value: "false"
      # Vercel forwards /api/* here, so no CORS list is needed. Only for a browser that calls this
      # API directly from another origin (comma-separated, no trailing slash).
      - key: FRONTEND_ORIGINS
        sync: false
      # The Vercel site's URL: the buttons and Terms / Privacy links in emails point at it.
      - key: APP_URL
        sync: false
      # Keep it secret and unchanged across deploys: it is mixed into every password hash and
      # signs the sign-in steps (changing it signs every student out and locks them out).
      - key: AUTH_PEPPER
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      # Optional: a hosted Postgres URL (e.g. Supabase) that receives a background copy of the
      # telemetry for the faculty dashboard. Accounts and sessions are never synced to it.
      - key: DATABASE_URL
        sync: false
      # Paid plan with the disk below: keep the SQLite files on it so they survive deploys.
      # - key: DB_PATH
      #   value: /data/placementiq.db
      # - key: TELEMETRY_DB_PATH
      #   value: /data/placement_nexus.db
