<div class="ssn-proctor">
  <div class="pre" hidden>
    <p class="title">Before you start: proctoring check</p>
    <div class="row">
      <div class="cam"><video muted playsinline></video><p class="nocam" hidden></p></div>
      <ul class="hints">
        <li class="light">Lighting: checking…</li>
        <li>The test opens in fullscreen. Stay in it until you submit.</li>
        <li>The picture is checked only in this browser; no video or image is sent or saved.</li>
      </ul>
    </div>
    <p class="consent"></p>
    <label><input type="checkbox" class="agree" /> I have read this and agree to start a proctored test.</label>
    <button type="button" class="start" disabled>Start in fullscreen</button>
  </div>
  <div class="run" hidden>
    <span class="state"></span>
    <button type="button" class="back" hidden>Return to fullscreen</button>
    <span class="camnote"></span>
  </div>
  <canvas width="64" height="48" hidden></canvas>
</div>
